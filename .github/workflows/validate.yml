name: Validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate marketplace JSON and required files
        run: python scripts/validate_structure.py

      - name: Lint markdown
        run: |
          npm install -g markdownlint-cli@0.43.0
          npx markdownlint "**/*.md" --ignore node_modules --ignore tests/fixtures --config .markdownlint.json
