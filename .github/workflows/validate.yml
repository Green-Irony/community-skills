name: Validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate marketplace structure
        uses: Green-Irony/gi-core/.github/actions/marketplace-lint@main

      - name: Lint markdown
        run: |
          npm install -g markdownlint-cli@0.43.0
          npx markdownlint "**/*.md" --ignore node_modules --ignore tests/fixtures --config .markdownlint.json
